[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pptx2template"
version = "0.2.0"
description = "Convert an ordinary PowerPoint deck into a reusable multi-layout .potx template - rule-based, offline, no AI."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["python-pptx>=0.6.21", "lxml>=4.6", "PyYAML>=5.4"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/trunjeee/pptx2template"
Issues = "https://github.com/trunjeee/pptx2template/issues"

[project.optional-dependencies]
visual = ["Pillow"]
test = ["pytest"]

[project.scripts]
pptx2template = "pptx2template.cli:main"
pptx2template-ui = "pptx2template.ui.server:main"

[tool.setuptools]
packages = ["pptx2template", "pptx2template.ui"]

[tool.setuptools.package-data]
"pptx2template.ui" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
