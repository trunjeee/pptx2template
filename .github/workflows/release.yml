name: build apps

# Builds the standalone app for every OS. Run it by hand (Actions -> build apps -> Run workflow)
# or push a tag like v0.1.0 to also attach the files to a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: pptx2template-windows.zip
          - os: macos-latest
            asset: pptx2template-macos.zip
          - os: ubuntu-latest
            asset: pptx2template-linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[test] pyinstaller
      - run: pytest -q
      - run: pyinstaller --noconfirm packaging/pptx2template.spec

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/pptx2template.exe -DestinationPath ${{ matrix.asset }}
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/pptx2template.app ${{ matrix.asset }}
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.asset }} -C dist pptx2template

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
